name: Codex Issue worker
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: number
permissions:
  contents: write
  pull-requests: write
jobs:
  resolve:
    if: >-
      github.actor == 'w1163563154' &&
      (github.event_name == 'workflow_dispatch' || !github.event.issue.pull_request)
    runs-on: [codex-myflutter]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Process latest Issue requirements
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: ./.github/scripts/resolve-issue.ps1
