name: Codex Issue worker
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: number
permissions:
  contents: write
  pull-requests: write
jobs:
  resolve:
    if: github.actor == 'w1163563154'
    runs-on: [codex-myflutter]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Process latest Issue requirements
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: ./.github/scripts/resolve-issue.ps1
